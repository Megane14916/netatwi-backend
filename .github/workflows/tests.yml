name: Backend tests

on:
  push:
    branches: [master, fix/step-11-bugs, refactor/step-12-structure, refactor/step-13-behavior]
  pull_request:
    branches: [master, fix/step-11-bugs, refactor/step-12-structure, refactor/step-13-behavior]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netatwi_test
          POSTGRES_PASSWORD: netatwi_test
          POSTGRES_DB: netatwi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netatwi_test -d netatwi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify PostgreSQL concurrency
        env:
          TEST_POSTGRESQL_URI: postgresql+psycopg2://netatwi_test:netatwi_test@127.0.0.1:5432/netatwi_test
        run: python -m pytest -q tests/integration/test_postgres_result_concurrency.py tests/integration/test_postgres_bookmark_concurrency.py
